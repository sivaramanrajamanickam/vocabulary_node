name: Build Vocabulary Semantic Graph

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "requirements.txt"
      - "ENGLISH.pdf"
      - "HSK.pdf"
      - ".github/workflows/build-graph.yml"

permissions:
  contents: read

jobs:
  build-semantic-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-paraphrase-multilingual-mpnet-base-v2
          restore-keys: |
            huggingface-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK WordNet data
        run: |
          python -m nltk.downloader wordnet omw-1.4
          
      - name: Build language-separated graph
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          rm -rf output
          python -u app.py \
            --english ENGLISH.pdf \
            --hsk HSK.pdf \
            --out output \
            --model sentence-transformers/paraphrase-multilingual-mpnet-base-v2 \
            --semantic-threshold 0.80 \
            --meaning-group-threshold 0.90 \
            --translation-threshold 0.80 \
            --same-language-k 30 \
            --translation-k 100 \
            --batch-size 32

      - name: Upload vocabulary graph output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-semantic-graph
          path: |
            output/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failure logs or partial output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-output
          path: |
            output/
          if-no-files-found: ignore
          retention-days: 7
